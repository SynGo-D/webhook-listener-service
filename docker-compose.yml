services:
  postgres:
    image: postgres:16-alpine
    container_name: webhook-listener-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: webhook_listener_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      # Mapped to 5433 on the host: integration-service already occupies the
      # native Postgres install on 5432, and this stack is meant to be able
      # to run alongside it during local development.
      - "5433:5432"
    volumes:
      - webhook_listener_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d webhook_listener_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: webhook-listener-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"   # AMQP protocol port (used by the service)
      - "15672:15672" # Management UI: http://localhost:15672
    volumes:
      - webhook_listener_rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  webhook_listener_postgres_data:
  webhook_listener_rabbitmq_data:
