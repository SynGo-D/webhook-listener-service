name: CI

# Every branch, so a problem is found where it was written rather than at
# the merge, and every pull request, so the merge itself is checked too.
on:
  push:
    branches: ["**"]
  pull_request:

# A second push to the same branch makes the first run's answer worthless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Types, tests and build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # ci, not install: it installs exactly what package-lock.json pins
      # and fails if the lockfile and package.json disagree, so CI can
      # never pass against a dependency tree nobody has.
      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Tests
        run: npm test

      # The build is part of the check: tsc --noEmit and a real emit can
      # differ, and this is what the image runs.
      - name: Build
        run: npm run build

  image:
    name: Container image
    needs: check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Built but not pushed: this proves the Dockerfile still works on
      # every change. Publishing to ECR belongs to the deployment workflow,
      # which runs only from main.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: webhook-listener:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
